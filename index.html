<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energicentral</title>
<style>
:root{
  --bg:#eef0f3;--card:#fff;--ink:#14171b;--mut:#626b78;--line:#dfe3e8;--soft:#f5f6f8;
  --cur:#2f6fdd;--prev:#8f98a8;--good:#16844a;--bad:#c53838;--on:#f2a516;--accent:#2f6fdd;--accent-ink:#fff;
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1013;--card:#171a1f;--ink:#eef0f3;--mut:#9aa3af;--line:#272c34;--soft:#1e2228;
    --cur:#6da2ff;--prev:#7b8494;--good:#4cc38a;--bad:#ff7b7b;--on:#ffc24a;--accent:#6da2ff;--accent-ink:#0b1220}
}
:root[data-theme="dark"]{--bg:#0e1013;--card:#171a1f;--ink:#eef0f3;--mut:#9aa3af;--line:#272c34;--soft:#1e2228;
    --cur:#6da2ff;--prev:#7b8494;--good:#4cc38a;--bad:#ff7b7b;--on:#ffc24a;--accent:#6da2ff;--accent-ink:#0b1220}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}

/* ---------- layout: vänstermeny ---------- */
.app{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:14px 10px}
.brand{font-weight:750;font-size:19px;letter-spacing:-.3px;padding:4px 10px 12px}
.side .grp{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);padding:14px 10px 4px}
nav{display:flex;flex-direction:column;gap:1px}
nav button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--mut);text-align:left;border-radius:10px;white-space:nowrap}
nav button:hover{background:var(--soft)}
nav button[aria-selected=true]{background:var(--soft);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.side .sp{flex:1}
.side .foot{display:flex;flex-direction:column;gap:8px;padding:10px 4px 0;border-top:1px solid var(--line);margin-top:10px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font-weight:600;color:var(--mut);min-height:40px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:5px 10px;min-height:30px;font-size:13px}
.content{flex:1;min-width:0}
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.grow{flex:1}
.status{font-size:13px;color:var(--mut)}
.err{color:var(--bad)}
.attn{border-color:var(--bad)}
.attn li{margin:3px 0}
body.panel .side,body.panel .top{display:none}
body.panel main{max-width:none}
body.panel .tile .v{font-size:56px}
#panelX{display:none;position:fixed;top:10px;right:12px;z-index:30}
body.panel #panelX{display:block}
@media(max-width:800px){
  .app{display:block}
  .side{position:sticky;top:0;z-index:25;width:auto;height:auto;flex-direction:row;align-items:center;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .brand,.side .grp,.side .sp,.side .foot{display:none}
  nav{flex-direction:row}
  .top{position:static}
}
main{max-width:1280px;margin:0 auto;padding:18px 18px 70px}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
h3{font-size:14px;margin:18px 0 8px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.det{margin:0 0 26px;scroll-margin-top:120px}.det>summary{cursor:pointer;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:14px;list-style:none}.det>summary::before{content:"▾ ";color:var(--mut)}.det:not([open])>summary::before{content:"▸ "}
.rowN{display:grid;gap:12px;grid-template-columns:repeat(var(--c,4),minmax(0,1fr))}
.grp{margin:0 0 22px}.grp>h3{margin:0 0 10px}
@media(max-width:900px){.rowN{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.note{color:var(--mut);font-size:13px;margin-top:8px}
.warn{background:#fff4dd;color:#6f4400;border:1px solid #efd08a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#2b2411;color:#f2d28f;border-color:#58461c}}
:root[data-theme="dark"] .warn{background:#2b2411;color:#f2d28f;border-color:#58461c}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:11px;min-height:40px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:999px;font-weight:600;min-height:40px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.bar label{color:var(--mut);font-size:14px;display:flex;gap:6px;align-items:center}
input[type=date],input[type=text],input[type=password],input[type=search],select{border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:10px;min-height:40px}

/* ---------- tiles ---------- */
.tile .l{color:var(--mut);font-size:14px}
.tile .v{font-size:38px;font-weight:750;letter-spacing:-1px;margin:2px 0 0;line-height:1.1}
.tile .v small{font-size:17px;font-weight:600;color:var(--mut);letter-spacing:0}
.tile .s{font-size:13.5px;color:var(--mut);margin-top:4px;min-height:19px}
.up{color:var(--bad)}.down{color:var(--good)}
.tile.hero .v{font-size:48px}

/* ---------- chart / tables ---------- */
.legend{display:flex;gap:16px;color:var(--mut);font-size:13px;margin:2px 0 6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg text{fill:var(--mut);font-size:11px}
table{width:100%;border-collapse:collapse}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
.adm td,.adm th{text-align:left;white-space:normal}
.adm td input[type=text]{width:100%;min-width:120px;padding:5px 8px;min-height:34px}

/* ---------- devices ---------- */
.zonehead{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.zonehead b{font-size:17px}
.dev{display:flex;flex-direction:column;gap:10px;padding:14px 16px}
.dev .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dev .nm{font-weight:650;line-height:1.2}
.dev .sub{color:var(--mut);font-size:13px;margin-top:2px}
.dev.on{border-color:var(--on);box-shadow:inset 0 0 0 1px var(--on)}
.sw{width:58px;height:34px;border-radius:17px;border:0;background:var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px #0005}
.sw[aria-checked=true]{background:var(--on)}
.sw[aria-checked=true]::after{left:28px}
input[type=range]{width:100%;height:34px;accent-color:var(--on)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:7px}
.dot.on{background:var(--on)}.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}
.flow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.flow .nm{font-weight:650}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.pill{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--mut)}
.pill.bad{color:var(--bad);border-color:var(--bad)}

#dlg{max-width:1100px;width:96vw;max-height:92vh;overflow:auto;padding:0}#dlgBody{padding:16px 20px 24px}
.mhead{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}.mhead h2{font-size:22px;margin:0}
.kcard,.chartcard{cursor:pointer;transition:.12s}.kcard:hover,.chartcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.kcard .big{font-size:34px;font-weight:750;letter-spacing:-1px;line-height:1.1}.kcard .big small{font-size:15px;color:var(--mut);font-weight:600;letter-spacing:0}
.kcard .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.kcard .nm{font-weight:650}.kcard .live{font-size:13px;color:var(--mut)}
.kcard .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mut);margin-top:6px}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}.hbar .lab{width:140px;flex:none}.hbar .tr{flex:1;background:var(--soft);border-radius:6px;height:18px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--cur);border-radius:6px}.hbar .val{width:92px;text-align:right;flex:none}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:8px 0}.stack i{display:block;height:100%}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);max-width:420px;width:92%}
dialog::backdrop{background:#0009}
.adm-l{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);margin:0 0 10px}.adm-l input[type=text],.adm-l input[type=password]{width:100%}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand">Energicentral</div>
  <nav id="nav">
    <span class="grp">Hem</span>
    <button data-tab="oversikt" aria-selected="true">Översikt</button>
    <span class="grp">Energi</span>
    <button data-tab="energi" aria-selected="false">Energi</button>
    <button data-tab="timpris" aria-selected="false">Timpris</button>
    <button data-tab="detalj" aria-selected="false">Detaljer</button>
    <span class="grp">Klimat</span>
    <button data-tab="klimat" aria-selected="false">Värme &amp; klimat</button>
    <span class="grp">Styrning</span>
    <button data-tab="styr" aria-selected="false">Enheter</button>
    <button data-tab="flows" aria-selected="false">Flows</button>

</div>
<button class="btn sm" id="panelX">Avsluta panel-läge</button>
<main>
  <div id="demoWarn" class="warn hide">Demoläge: allt du ser är exempeldata. Gå till Admin, ange Homeys IP och API-nyckel och stäng av demoläget.</div>
  <div id="errBox" class="warn hide"></div>
  <section id="p-oversikt"></section>
  <section id="p-kort" class="hide"></section>
  <section id="p-energi" class="hide"></section>
  <section id="p-detalj" class="hide"></section>
  <section id="p-timpris" class="hide"></section>
  <section id="p-klimat" class="hide"></section>
  <section id="p-styr" class="hide"></section>
  <section id="p-flows" class="hide"></section>
  <section id="p-status" class="hide"></section>
  <section id="p-admin" class="hide"></section>
</main>
</div></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
"use strict";
/* =====================================================================

const DEFAULTS={

  fuse:20,zones236:["34b25977-ba64-49f5-816c-90adeb4091eb"],
  ids:{
    tibber:"9984ff30-8ea8-4a59-8b77-ca10a9722cdf",hush:"d2a46475-4494-4794-ad4a-413f89209ecf",
    uppv:"f6565b0d-0a1b-4d61-be3d-21e064f0af16",vp:"2b491c90-9448-47be-85a4-c4de18e5a711",ovr:"",
    d236:"1ca574f7-b087-479d-a716-ea9979384536",live235:"560efffc-57e8-4277-a202-933f2f6efb58",
    price:"295dc09b-d336-44d9-ae2b-69f4dabfa4fd",elpris:"d58b4538-b597-4d48-b58d-1794b7ff6d64",m236prev:"b71aea9a-d306-45a2-90da-b3d589591c31",m236day:"1abf7a52-82b5-47ba-a4a4-0a456b938601",m236month:"30272262-e61d-4e99-b536-c843c3911500",m236prevE:"557af22f-ec2e-4f3a-b1ec-a0ab647667af",m236dayN:"bafbd37d-aa8e-46a3-8582-f08604fc8b88",m236monthN:"cfc670ef-0eff-42a8-9ecf-517091618958",l236_1:"9634d738-f370-44ec-b383-1dd540b63ea3",l236_2:"a09151a6-eec7-418e-b57f-6e6eff63f20d",l236_3:"ed39ab86-96bc-46e3-8af0-ee01960a45e5",medDay:"099775fc-10b2-44c1-8c24-6a3cc38410f4",medMonth:"a56b2140-836d-4fbc-91a5-3288e42638c4",medDayN:"5321b749-cfdb-40a7-909b-6f71cc695ad3",medMonthN:"9e93aaa6-c48a-41b8-a498-06db07cc957b",timSnitt:"f8346588-0055-474e-94eb-d4fc2026ee6a",ute:"3150c9c6-321c-4899-bfa7-aba1cb2c69f4",smhi:"50f3bd05-f781-4228-ac26-1dfda87334e4",
    tesla:"ca242f00-ccb8-4294-9ce0-3dfc0ac7e80f",teslaE:"6a9cf6dd-fbe3-45b7-87ab-bbd2e4537740",nibe:"85cf3372-d5b3-4e5e-af3e-fb85706161ae",
    trLoad:"703bcab7-aae9-4edc-a5ab-eb63010932ab",entre:"969c95cb-de0a-4222-9510-0761ca0d0721",fastighet:"983c3c84-a1ef-4c64-b36d-f6c6ff093792",trHeat:"27faf458-da78-4fd1-9f4d-38ff020b52ef",floor:"dd6e780b-d248-4361-a3da-f3c85cae414c",avlopp:"fcc9481a-db30-43ed-a120-fc1c82d53dae",inneKok:"97c95291-0a6a-45eb-a7d5-39695c4fa655",ventilation:"8904d830-126c-4c0d-9a6c-6bc67c1f77ad",koksfläkt:"ab42117b-5917-4f1b-aaa6-9537931a7c2f",spotKok:"626665dc-15f5-4fa9-9e6c-8fc4fbbe74fc",ytterdorr:"11743e4d-2bf0-408a-a606-db890cddd7c6",vvb:["c098d905-8ad7-44d9-a928-616d53d46cfa","4096413f-1648-4014-97fc-86aeb7032313","cf3990b1-3f99-4903-8e54-6ee25846254e"],slab:"0fcc0b8a-3ab5-4d8f-aa6e-e54fa9df9e8e",vp236:"1504a89d-10ee-4382-9a5b-b75db1dee780",trRep:"",golvRep:""
  },
  ui:{devices:{},flows:{},status:{lights:true,sockets:true,locks:true,open:true,alarms:true,motion:true,battery:true,temps:true}}
};
const SRC=[{k:"tibber",name:"Tibber, hela huset",total:true},{k:"hush",name:"Hushållsel"},{k:"uppv",name:"Uppvärmning"},{k:"vp",name:"Värmepump"},{k:"ovr",name:"Övrigt"}];
const REFRESH_MS=20000;

function clone(o){return JSON.parse(JSON.stringify(o));}
function loadCfg(){
  try{const s=JSON.parse(localStorage.getItem("homeyDash2")||"null");
    if(s){const d=clone(DEFAULTS);if(!s.workerUrl)delete s.workerUrl;return {...d,...s,ids:{...d.ids,...(s.ids||{})},ui:{devices:{...(s.ui&&s.ui.devices)},flows:{...(s.ui&&s.ui.flows)},status:{...d.ui.status,...(s.ui&&s.ui.status)}}};}}catch(e){}
  return clone(DEFAULTS);
}
let cfg=loadCfg();
function persist(){try{localStorage.setItem("homeyDash2",JSON.stringify(cfg));}catch(e){}}
const isCloud=()=>cfg.mode==="cloud";
const isDemo=()=>cfg.demo||!(isCloud()?(cfg.workerUrl&&cfg.session):(cfg.ip&&cfg.key));

const state={detClosed:{},h236d:"",h236m:"",dark:window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches,climSel:"",climPer:"last24Hours",sensPer:"7d",sensFrom:"",sensTo:"",climZone:"",det:"timmar",hourly:null,prop:"235",unit:"kr",tab:"oversikt",preset:"manad",cmp:"prev",from:"",to:"",
  devices:{},zones:{},flows:[],flowsAt:0,cache:{},adminOk:false,flash:{},search:"",adminSearch:""};

/* =====================================================================
   HJÄLPARE
   ===================================================================== */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);};
const diffDays=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const shiftYear=(s,n)=>(parseInt(s.slice(0,4))+n)+s.slice(4);
const fmt=(n,d=0)=>(n==null||isNaN(n))?"–":Number(n).toLocaleString("sv-SE",{minimumFractionDigits:d,maximumFractionDigits:d});
const MON=["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const labelDate=s=>{const p=s.split("-").map(Number);return p[2]+" "+MON[p[1]-1];};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const capVal=(d,c)=>d&&d.capabilitiesObj&&d.capabilitiesObj[c]?d.capabilitiesObj[c].value:null;
const unitName=u=>u==="kr"?"kr":"kWh";

/* =====================================================================
   HOMEY API (lokalt nät)
   ===================================================================== */
function base(){if(isCloud())return cfg.workerUrl.trim().replace(/\/$/,"");const ip=cfg.ip.trim();return /^https?:\/\//.test(ip)?ip.replace(/\/$/,""):"http://"+ip;}
async function api(path,opt={}){
  const r=await fetch(base()+path,{...opt,headers:{"Authorization":"Bearer "+(isCloud()?cfg.session:cfg.key),"Content-Type":"application/json"}});
  if(r.status===401&&isCloud()){cfg.session="";persist();throw new Error("Du är utloggad. Gå till Admin och logga in med Homey igen.");}
  if(!r.ok){let bt="";try{bt=(await r.text()).slice(0,160);}catch(e){}throw new Error("Homey svarade "+r.status+" på "+path+(bt?" – "+bt:""));}
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}
  return (j&&j.result!==undefined)?j.result:j;
}
let LOGLIST=null;
async function logList(){
  if(LOGLIST)return LOGLIST;
  const r=await api("/api/manager/insights/log/");
  LOGLIST=Array.isArray(r)?r:Object.values(r||{});return LOGLIST;
}
async function findLog(devId,cap){
  const uri="homey:device:"+devId,full=uri+":"+cap,L=await logList();
  return L.find(l=>l.uri===uri&&l.id===cap)||L.find(l=>l.id===full)||L.find(l=>(l.uri+":"+l.id)===full)||null;
}
const LOGPATHS=[

/* "igår"-räknaren ligger konstant under hela dygnet: bucketen 12:00 UTC dag D = totalen för D-1 */
function dailyFromLastDay(entries){
  const m={};
  for(const e of entries){if(e.v==null)continue;const d=new Date(e.t);if(d.getUTCHours()!==12)continue;
    m[new Date(d.getTime()-864e5).toISOString().slice(0,10)]=e.v;}
  return m;
}
function dailyFromCumulative(entries,resetsYearly){
  const c={};
  for(const e of entries){if(e.v==null)continue;const d=new Date(e.t);if(d.getUTCHours()!==12)continue;c[d.toISOString().slice(0,10)]=e.v;}
  const m={};
  for(const day of Object.keys(c)){const p=c[addDays(day,-1)];if(p==null)continue;let v=c[day]-p;if(v<0&&resetsYearly)v=c[day];if(v>=0)m[day]=v;}

function resolutionsFor(minDate){

async function fetchMerged(devId,cap,minDate,conv){

/* kr saknas i Homey för vissa enheter: uppskatta med dygnets snittpris (kr/kWh) för hela huset. Rapportenhet i Homey ger exakt värde. */
/* kr per dygn = summan av (kWh den timmen x timpriset den timmen), bara timmar då enheten var igång. Gäller senaste 7 dagarna (längre bakåt är Homeys logg grövre än en timme). */
/* Energikostnad per intervall ur kumulativ mätare: kWh = differens mellan två avläsningar, kr = kWh x priset som gällde under intervallet. */
function calculateEnergyIntervals(samples){
  const o=[...samples].sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)),out=[];
  for(let i=1;i<o.length;i++){
    const p=o[i-1],c=o[i],s=new Date(p.timestamp).getTime(),e=new Date(c.timestamp).getTime();
    if(!Number.isFinite(s)||!Number.isFinite(e)||e<=s||!Number.isFinite(p.cumulativeKwh)||!Number.isFinite(c.cumulativeKwh)||!Number.isFinite(c.totalPriceSekPerKwh))continue;
    const kwh=c.cumulativeKwh-p.cumulativeKwh;
    if(kwh<0)continue; /* mätaråterställning */
    out.push({start:p.timestamp,end:c.timestamp,kwh,costSek:kwh*c.totalPriceSekPerKwh});
  }
  return out;
}
/* Timvis kr ur mätarens kumulativa logg (timupplöst, senaste 7 dagarna). Varje timintervall prissätts med timpriset för just den timmen. Luckor eller saknat pris stryker dygnet (då används dygnsuppskattning). */
async function hourlyKrCum(id){
  const ph=await loadPriceHist(),es=(await logEntries(id,"meter_power","last7Days")).filter(e=>e.v!=null).sort((a,b)=>a.t-b.t);
  if(es.length<3)return null;
  const out={},bad={};
  for(let i=1;i<es.length;i++){
    const a=es[i-1],b=es[i],gap=(b.t-a.t)/6e4,k=hourKey(new Date(a.t)),d=k.slice(0,10);
    if(gap>75||gap<45){bad[d]=1;continue;}
    const pr=ph[k];if(pr==null){bad[d]=1;continue;}
    const iv=calculateEnergyIntervals([{timestamp:new Date(a.t).toISOString(),cumulativeKwh:a.v,totalPriceSekPerKwh:pr},{timestamp:new Date(b.t).toISOString(),cumulativeKwh:b.v,totalPriceSekPerKwh:pr}]);
    if(!iv.length){bad[d]=1;continue;}
    out[d]=(out[d]||0)+iv[0].costSek;
  }
  for(const d in bad)delete out[d];
  const f=new Date(es[0].t);delete out[hourKey(f).slice(0,10)];
  return Object.keys(out).length?out:null;
}
async function hourlyKrBest(id){try{const c=await hourlyKrCum(id);if(c)return c;}catch(e){}return hourlyKr(id);}
async function hourlyKr(id){
  if(!id)return {};
  const ph=await loadPriceHist(),es=await logEntries(id,"measure_power","last7Days"),sm={},ct={};
  for(const e of es){if(e.v==null)continue;const k=hourKey(new Date(e.t));sm[k]=(sm[k]||0)+e.v;ct[k]=(ct[k]||0)+1;}
  const out={},bad={};
  for(const k in sm){const kw=sm[k]/ct[k]/1000,d=k.slice(0,10);
    if(kw<0.005){if(out[d]==null)out[d]=0;continue;}
    if(ph[k]==null){bad[d]=1;continue;}
    out[d]=(out[d]||0)+kw*ph[k];}
  for(const d in bad)delete out[d];
  const ks=Object.keys(sm).sort();if(ks.length&&ks[0].slice(11)!=="00")delete out[ks[0].slice(0,10)]; /* första dygnet är bara delvis täckt av loggen */
  return out;
}
function addEstKr(S){

function onoffTile(d,nm,label,sub,cls,quick){if(!d)return "";const on=!!capVal(d,"onoff"),pw=capVal(d,"measure_power");
  if(quick)return `<div class="card tile ${cls||""}" data-act="toggle" data-id="${esc(d.id)}" tabindex="0" role="switch" aria-checked="${on}" title="Klicka för att slå ${on?"av":"på"}" style="cursor:pointer;${on?"border:2px solid var(--on);":""}"><div class="l"><span class="dot ${on?"on":""}"></span> ${esc(label)}<button class="btn sm" data-onoff="${esc(d.id)}" data-nm="${esc(nm)}" style="float:right;padding:0 8px;min-height:24px;font-size:12px" title="Visa historik">Historik</button></div><div class="v" style="${on?"color:var(--on)":""}">${on?"PÅ":"Av"}</div><div class="s">${pw!=null?fmt(pw,0)+" W":""}${sub?(pw!=null?" · ":"")+sub:""}</div></div>`;
  return `<div class="card tile ${cls||""}" data-onoff="${esc(d.id)}" data-nm="${esc(nm)}" tabindex="0" role="button" title="Visa historik och styr" style="cursor:pointer;${on?"border:2px solid var(--on);":""}"><div class="l"><span class="dot ${on?"on":""}"></span> ${esc(label)}</div><div class="v" style="${on?"color:var(--on)":""}">${on?"PÅ":"Av"}</div><div class="s">${pw!=null?fmt(pw,0)+" W":""}${sub?(pw!=null?" · ":"")+sub:""}</div></div>`;}
function golvGroup(f,sensors){
  if(!f)return "";const v=i=>capVal(f,"measure_temperature."+i);let h=onoffTile(f,"Golvvärme","Golvvärme","");
  if(sensors){h+=v(1)!=null?sensTile(f.id,"measure_temperature.1","Framledning golvvärme",fmt(v(1),1),"°C","Givare 1"):"";
    h+=v(2)!=null?sensTile(f.id,"measure_temperature.2","Returledning golvvärme",fmt(v(2),1),"°C","Givare 2"):"";
    h+=v(1)!=null&&v(2)!=null?tile("ΔT golvvärme",fmt(v(1)-v(2),1),"°C","Fram − retur"):"";}
  h+=capVal(f,"meter_power")!=null?tile("Energi totalt",fmt(capVal(f,"meter_power"),0),"kWh","Ackumulerat"):"";
  return grp("Golvvärme",h,sensors?5:4);
}
function uterumGroup(sl,f,withFloor){
  const v=i=>capVal(f,"measure_temperature."+i);let h="";
  if(sl)h+=sensTile(sl.id,"measure_temperature","Betongplatta",fmt(capVal(sl,"measure_temperature"),1),"°C",capVal(sl,"measure_humidity")!=null?sensLink(sl.id,"measure_humidity","Luftfuktighet "+fmt(capVal(sl,"measure_humidity"),0)+" %"):"");
  if(f){h+=v(3)!=null?sensTile(f.id,"measure_temperature.3","Framledning uterum",fmt(v(3),1),"°C","Givare 3"):"";
    h+=v(4)!=null?sensTile(f.id,"measure_temperature.4","Returledning uterum",fmt(v(4),1),"°C","Givare 4"):"";
    h+=v(3)!=null&&v(4)!=null?tile("ΔT uterum",fmt(v(3)-v(4),1),"°C","Fram − retur"):"";}
  if(withFloor&&f){h+=onoffTile(f,"Golvvärme","Golvvärme","");if(capVal(f,"meter_power")!=null)h+=tile("Golvvärme energi",fmt(capVal(f,"meter_power"),0),"kWh","Ackumulerat");}
  return h?grp("Uterum",h,4):"";
}
function ventGroup(){

function dualTile(attrs,label,a,b,cls){
  const col=x=>`<div style="min-width:0"><div class="v" style="font-size:26px;white-space:nowrap">${x.est?"≈ ":""}${fmt(x.v,x.dec||0)} <small>${x.un}</small></div><div class="s" style="font-size:12.5px;min-height:18px;white-space:nowrap">${x.sub||""}</div></div>`;

function tile(label,value,unit,sub,cls){return `<div class="card tile ${cls||""}"><div class="l">${label}</div><div class="v">${value}${unit?` <small>${unit}</small>`:""}</div><div class="s">${sub||""}</div></div>`;}

function heatCards(){

const PWRON=5;
async function onoffSegs(id,f,t,cap){
  const cur=!!capVal(state.devices[id],"onoff");let es=[];
  if(isDemo()){const n=Math.max(4,Math.round((t-f)/36e5/6));let st=true,x=f;for(let i=0;i<n;i++){es.push({t:x,v:st});st=!st;x+=(t-f)/n*(0.4+((i*7)%5)/5);if(x>=t)break;}}
  else es=await logEntries(id,cap,sensRes(t-f));
  es=es.filter(e=>e.v!=null).map(e=>({t:new Date(e.t).getTime(),v:cap==="measure_power"?Number(e.v)>PWRON:(e.v===true||e.v===1||e.v==="true")})).filter(e=>e.t<t).sort((a,b)=>a.t-b.t);
  const seg=[];
  for(let i=0;i<es.length;i++){const s0=Math.max(f,es[i].t),s1=i+1<es.length?es[i+1].t:t;if(s1>f)seg.push({s:s0,e:Math.min(t,s1),on:es[i].v});}
  if(seg.length&&seg[seg.length-1].on!==cur&&!isDemo()){/* senaste loggade läget gäller till nu */}
  return seg;
}
async function onoffModalHtml(id){
  const d=state.devices[id];if(!d)return `<div class="warn">Enheten hittades inte.</div>`;
  const [f,t]=sensRange(),on=!!capVal(d,"onoff"),nm=(heatDevs().find(x=>x[0]&&x[0].id===id)||[0,devName(d)])[1];

  ${capVal(d,"dim")!=null?`<div class="card" data-id="${esc(id)}" style="margin:12px 0"><label style="display:flex;gap:12px;align-items:center">Ljusstyrka <input type="range" min="0" max="100" value="${Math.round((capVal(d,"dim")||0)*100)}" data-act="dim" style="flex:1"> <b>${Math.round((capVal(d,"dim")||0)*100)} %</b></label></div>`:""}<div class="grid">${tile("Effekt nu",fmt(capVal(d,"measure_power"),0),"W","")}${tile("Energi totalt",fmt(capVal(d,"meter_power"),1),"kWh",capVal(d,"meter_power")==null?"Ingen energimätare":"Mätarställning")}</div>

  ${state.sensPer==="custom"?`<label>Från <input type="date" id="sensfrom" value="${state.sensFrom||addDays(todayStr(),-7)}" max="${todayStr()}"></label><label>Till <input type="date" id="sensto" value="${state.sensTo||todayStr()}" max="${todayStr()}"></label>`:""}</div>`;
  const hasP=!!(d.capabilitiesObj&&d.capabilitiesObj.measure_power);
  let segP=[],segO=[],err="";

  if(hasOnoff(d)){try{segO=await onoffSegs(id,f,t,"onoff");}catch(e){if(!hasP)err=e.message;}}
  const seg=segP.length?segP:segO,what=segP.length?"drar energi":"är påslagen";
  if(!seg.length)return h+`<div class="note">Ingen historik hittades för perioden${err?" ("+esc(err)+")":""}. Kontrollera att Homey loggar enhetens ${hasP?"effekt":"på/av"} (Insights).</div>`;
  const onMs=seg.filter(x=>x.on).reduce((a,x)=>a+x.e-x.s,0),known=seg.reduce((a,x)=>a+x.e-x.s,0),starts=seg.filter((x,i)=>x.on&&(i===0?false:!seg[i-1].on)).length;
  h+=`<div class="grid" style="margin-top:12px">${tile(segP.length?"Tid med effekt":"Tid på",fmt(onMs/36e5,1),"h",fmt(known?onMs/known*100:0,0)+" % av perioden"+(segP.length?" · över "+PWRON+" W":""))}${tile("Antal starter",String(starts),"","")}${tile("Längsta pass",fmt(Math.max(0,...seg.filter(x=>x.on).map(x=>(x.e-x.s)/36e5)),1),"h","")}</div>`;
  const W=1000,L=10,R=10,x=tt=>L+(W-L-R)*(tt-f)/(t-f),rows=[[segP,"Drar energi (effekt över "+PWRON+" W)"],[segO,"Påslagen (på/av)"]].filter(r=>r[0].length);
  const H=rows.length*56+34;let g="";
  rows.forEach(([sg,lb],i)=>{const y0=22+i*56;g+=`<text x="${L}" y="${y0-6}">${esc(lb)}</text><rect x="${L}" y="${y0}" width="${W-L-R}" height="30" fill="var(--line)" rx="4"/>`+sg.map(z=>`<rect x="${x(z.s).toFixed(1)}" y="${y0}" width="${Math.max(1.5,x(z.e)-x(z.s)).toFixed(1)}" height="30" fill="${z.on?"var(--cur)":"transparent"}"/>`).join("");});
  const long=(t-f)>2*864e5;
  for(let i=0;i<=4;i++){const tt=f+(t-f)*i/4,dd=new Date(tt);g+=`<text x="${x(tt)}" y="${H-4}" text-anchor="${i===0?"start":i===4?"end":"middle"}">${dd.getDate()}/${dd.getMonth()+1}${long?"":" "+pad(dd.getHours())+":00"}</text>`;}
  h+=`<div class="card" style="margin-top:14px"><h2>När den ${what}</h2><svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg></div>`;

    const days=[];for(let d0=new Date(f);d0.getTime()<t;d0=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+1))days.push(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()).getTime());
    const hrs=days.map(ds=>{const de=ds+864e5;return seg.filter(z=>z.on).reduce((a,z)=>a+Math.max(0,Math.min(z.e,de)-Math.max(z.s,ds)),0)/36e5;});
    h+=`<div class="card" style="margin-top:14px"><h2>Timmar i drift per dygn</h2>${barChart(hrs,null,days.map(ds=>{const dd=new Date(ds);return dd.getDate()+"/"+(dd.getMonth()+1);}),"h")}</div>`;
  }
  return h;
}

async function trHeatSchablon(){
  const W=Number(String(cfg.trHeatW||"").replace(",","."));if(!(W>0))return null;
  const d=state.devices[cfg.ids.trHeat];if(!d)return null;
  const now=Date.now(),t7=now-7*864e5,ds=new Date();ds.setHours(0,0,0,0);
  let segs=[],ph={};try{segs=await onoffSegs(cfg.ids.trHeat,t7,now,"onoff");ph=await loadPriceHist();}catch(e){return {err:true};}
  const calc=from=>{let h=0,kr=0,miss=false;
    for(const g of segs){if(!g.on)continue;let a=Math.max(g.s,from);const b=g.e;
      while(a<b){const hs=new Date(a);hs.setMinutes(0,0,0);const he=hs.getTime()+36e5,e2=Math.min(b,he),hrs=(e2-a)/36e5;h+=hrs;const p=ph[hourKey(hs)];if(p==null)miss=true;else kr+=hrs*W/1000*p;a=e2;}}
    return {h,kwh:h*W/1000,kr,miss};};
  return {W,today:calc(ds.getTime()),week:calc(t7),has:segs.length>0};
}

async function medelData236(){
  const now=new Date(),hs=new Date(now.getFullYear(),now.getMonth(),now.getDate(),now.getHours()).getTime();
  const ds=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),ms=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const D={now,doneDay:Math.floor((hs-ds)/36e5),doneMonth:Math.round((hs-ms)/36e5),p236:true};
  const devs=[cfg.ids.l236_1,cfg.ids.l236_2,cfg.ids.l236_3].map(id=>state.devices[id]);
  const lu=(d,c)=>{const o=d&&d.capabilitiesObj&&d.capabilitiesObj[c];const t=o&&(o.lastUpdated||o.lastChanged);return t?new Date(t).getTime():null;};
  const demo=isDemo(),fresh=(d,c)=>demo||(lu(d,c)!=null&&Date.now()-lu(d,c)<10*60*1000);
  /* A. aktuell effekt: summan av measure_power för L1–L3 */
  const pw=devs.map(d=>capVal(d,"measure_power"));
  D.power=pw.every(x=>x!=null)&&devs.every(d=>fresh(d,"measure_power"))?pw.reduce((a,b)=>a+b,0)/1000:null;
  D.powerWhy=devs.some(d=>!d)?"Fasmätare saknas i Homey":pw.some(x=>x==null)?"Mätvärde saknas på en fas":!devs.every(d=>fresh(d,"measure_power"))?"Gammalt mätvärde (>10 min)":"";

  if(en.every(x=>x!=null)&&devs.every(d=>fresh(d,"meter_power")||lu(d,"meter_power")==null)){
    const tm=Math.max(...devs.map(d=>lu(d,"meter_power")||Date.now()));
    let a=snap236Load().filter(x=>x.t>=now.getTime()-4*36e5);
    const last=a[a.length-1];
    if(!last||last.tm!==tm||last.e.some((x,i)=>x!==en[i]))a.push({t:now.getTime(),tm,e:en});
    snap236Save(a);
    const b=a.find(x=>x.tm>=hs-120000&&x.tm<=hs+600000&&x.tm<=tm);
    if(b){
      const secs=(tm-b.tm)/1000,kwh=en.reduce((s,x,i)=>s+(x-b.e[i]),0);
      if(secs<120)D.hourWhy="Mindre än två minuter sedan baslinjen";
      else if(kwh<0)D.hourWhy="Mätarställning har minskat (ogiltig)";
      else{const v=kwh/(secs/3600);if(v>3*(cfg.fuse||20)*0.23*1.15)D.hourWhy="Orimligt värde ("+fmt(v,1)+" kW)";else D.hour={v,kwh,min:secs/60};}
    }else D.hourWhy="ingen baslinje vid timmens start (sidan måste ha varit öppen då)";
  }else D.hourWhy=devs.some(d=>!d)?"Fasmätare saknas":"Mätarställning saknas eller är gammal";

  let V=null;
  if(demo){D.varT=Date.now();V={prevE:1.48,prev:1480,day:1.62,month:1.48,dayN:Math.max(D.doneDay,0),monthN:Math.max(D.doneMonth,0)};}
  else try{
    if(!state.vars||Date.now()-state.vars.t>20000)state.vars={t:Date.now(),v:await api("/api/manager/logic/variable/")};
    const all=state.vars.v||{},g=id=>{const x=Object.values(all).find(y=>y.id===id);return x&&x.value!=null&&x.value!==""?Number(x.value):null;};
    V={prevE:g(cfg.ids.m236prevE),prev:g(cfg.ids.m236prev),day:g(cfg.ids.m236day),month:g(cfg.ids.m236month),dayN:g(cfg.ids.m236dayN),monthN:g(cfg.ids.m236monthN)};
    D.varT=state.vars.t;
  }catch(e){D.varErr=e.message;}
  if(V){
    const ok=V.monthN>0;
    D.prev=ok&&V.prev!=null?{v:V.prev/1000,kwh:V.prevE}:null;
    if(D.prev&&D.prev.kwh!=null&&Math.abs(D.prev.v-D.prev.kwh)>Math.max(.05,D.prev.kwh*.05))D.prevWarn="W-variabeln ("+fmt(D.prev.v,2)+" kW) stämmer inte med energivariabeln ("+fmt(D.prev.kwh,2)+" kWh)";

    D.varsEmpty=!(V.dayN>0)&&!(V.monthN>0);

/* Letar efter en prislista (timpriser för flera timmar/dygn) i enhetens store/settings om Homey-appen lagrar en sådan. */
function extractPrices(dev){
  const out={};if(!dev)return out;
  const tk=["startsAt","start","time","from","date","timestamp","t","hour"],vk=["total","price","value","v","SEK_per_kWh","energy","spot"];
  const tryArr=a=>{let n=0;for(const x of a){let t=null,v=null;
      if(x&&typeof x==="object"){for(const k of tk)if(x[k]!=null){const d=new Date(x[k]);if(!isNaN(d)){t=d;break;}}for(const k of vk)if(typeof x[k]==="number"){v=x[k];break;}}
      if(t&&v!=null){out[hourKey(t)]=v;n++;}}return n;};
  const walk=(o,d)=>{if(o==null||d>4)return;
    if(typeof o==="string"&&/^\s*[\[{]/.test(o)&&o.length>100){try{walk(JSON.parse(o),d+1);}catch(e){}return;}
    if(Array.isArray(o)){if(o.length>=8&&typeof o[0]==="object")tryArr(o);else o.forEach(x=>walk(x,d+1));return;}
    if(typeof o==="object"){const ks=Object.keys(o);
      if(ks.length>=8&&ks.every(k=>!isNaN(new Date(k)))&&ks.every(k=>typeof o[k]==="number")){ks.forEach(k=>{out[hourKey(new Date(k))]=o[k];});return;}
      ks.forEach(k=>walk(o[k],d+1));}};
  walk(dev.store,0);walk(dev.settings,0);return out;
}

function cumArr(a){let c=0;return a.map(v=>{if(v==null)return c||null;c+=v;return c;});}
function polyChart(cur,prev,labels,unit){
  const W=1000,H=280,L=52,B=28,T=10,R=8,n=cur.length,all=[...cur,...(prev||[])].filter(x=>x!=null);
  if(!all.length)return `<div class="note">Ingen data.</div>`;
  const max=niceMax(Math.max(...all,0.0001)),bw=(W-L-R)/Math.max(1,n-1),y=v=>T+(H-T-B)*(1-v/max);let g="";
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(v,max<10?1:0)}</text>`;}
  const pts=a=>a.map((v,i)=>v==null?null:(L+i*bw)+","+y(v)).filter(Boolean).join(" ");
  if(prev)g+=`<polyline points="${pts(prev)}" fill="none" stroke="var(--prev)" stroke-width="2.4" stroke-dasharray="5 4" pointer-events="none"/>`;
  g+=`<polyline points="${pts(cur)}" fill="none" stroke="var(--cur)" stroke-width="3"/>`;
  const step=Math.max(1,Math.ceil(n/10));for(let i=0;i<n;i+=step)g+=`<text x="${L+i*bw}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`;

function parseCsv(t){const rows=[];let r=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===","){r.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";rows.push(r);r=[];}
    else f+=c;}
  if(f!==""||r.length){r.push(f);rows.push(r);}return rows;}
/* Arket "Effekt per timme": raden skrivs strax efter hel timme och gäller timmen FÖRE "Från"-tiden. Kolumnen Medel effekt (W) är hel och pålitlig; kWh-kolumnen tolkas ibland som klockslag av Google Sheets. */
async function sheetHourly(){
  const url=(cfg.sheetCsv||"").trim();if(!url)return null;
  const txt=await (await fetch(url,{cache:"no-store"})).text(),rows=parseCsv(txt);
  const hd=rows[0]||[],wi=hd.findIndex(x=>/medel\s*effekt/i.test(x)&&/\(W\)/.test(x)),out={};
  for(const r of rows.slice(1)){
    const dm=r.map(x=>(x||"").trim()).join("|").match(/(\d{1,2})-(\d{1,2})-(\d{4})\|(\d{1,2}):(\d{2})/);if(!dm)continue;
    let w=wi>=0&&r.length===hd.length?(r[wi]||"").trim():"";
    if(!/^\d{2,6}$/.test(w)){const src=r.findIndex(x=>/pulse|tibber|k[aä]lla/i.test(x||""));const c=r.slice(0,src>0?src:r.length).map(x=>(x||"").trim()).filter(x=>/^\d{3,6}$/.test(x));w=c.length?c[c.length-1]:"";}
    if(!/^\d{2,6}$/.test(w))continue;
    let d=new Date(+dm[3],+dm[2]-1,+dm[1],+dm[4],0);d=new Date(d.getTime()-36e5);
    const k=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours());
    if(out[k]==null)out[k]=Number(w)/1000;
  }
  return out;
}
async function loadHourly(){
  if(state.hourly&&Date.now()-state.hourly.t<5*60*1000)return state.hourly.v;
  const h={};
  if(isDemo()){
    const R=rnd(11),now=new Date();
    for(let i=24*31;i>=0;i--){const d=new Date(now.getTime()-i*36e5),hr=d.getHours();
      const base=0.9+0.5*Math.cos((hr-7)/24*2*Math.PI)+(hr>=17&&hr<=21?0.9:0)+R()*0.6;
      h[d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(hr)]=Math.max(0.3,base+(R()<0.04?3:0));}
  }else{
    const sums={},cnt={};
    /* Tibber-enhetens measure_watt_avg har riktig historik; Elmätarens measure_power loggas inte (tomma värden). */
    /* OBS: Homeys Insights ger bara TIMVÄRDEN för last7Days. last14Days/last31Days är grövre (3 h / 6 h per punkt) och får inte tolkas som timmedel. */
    let es=[];try{es=await logEntries(cfg.ids.tibber,"measure_watt_avg","last7Days");}catch(e){}
    if(!es.some(e=>e.v!=null))es=await logEntries(cfg.ids.live235,"measure_power","last7Days");
    for(const e of es){if(e.v==null)continue;const d=new Date(e.t),k=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours());
      sums[k]=(sums[k]||0)+e.v;cnt[k]=(cnt[k]||0)+1;}
    for(const k in sums)h[k]=sums[k]/cnt[k]/1000;
    state.sheetInfo="";
    try{const sh=await sheetHourly();if(sh){const n=Object.keys(sh).length;for(const k in sh)h[k]=sh[k];state.sheetInfo=n?"Timvärden hämtade från arket ("+n+" timmar).":"Arket lästes men inga timrader hittades.";}}
    catch(e){state.sheetInfo="Kunde inte läsa arket ("+e.message+"). Använder Homeys logg.";}
  }
  state.hourly={t:Date.now(),v:h};return h;
}
function lineChart(vals,labels,unit,color){
  const W=1000,H=260,L=52,B=28,T=10,R=8,n=vals.length;
  const all=vals.filter(x=>x!=null);if(!all.length)return `<div class="note">Ingen data.</div>`;
  const max=niceMax(Math.max(...all,0.0001)),bw=(W-L-R)/n,y=v=>T+(H-T-B)*(1-v/max);let g="";
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${fmt(v,max<10?1:0)}</text>`;}
  vals.forEach((v,i)=>{if(v==null)return;const iw=Math.max(1,bw*.7);g+=`<rect x="${L+i*bw+(bw-iw)/2}" y="${y(v)}" width="${iw}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="${color||"var(--cur)"}"><title>${labels[i]}: ${fmt(v,2)} ${unit}</title></rect>`;});
  const step=Math.max(1,Math.ceil(n/12));
  for(let i=0;i<n;i+=step)g+=`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}

function statusLists(){
  const L={lights:[],sockets:[],locks:[],open:[],alarms:[],motion:[],battery:[],temps:[]};
  for(const d of propDevices()){
    const c=d.capabilitiesObj||{};
    if(isLamp(d)&&c.onoff&&c.onoff.value)L.lights.push(d);
    else if(d.class==="socket"&&c.onoff&&c.onoff.value)L.sockets.push(d);
    if(d.class==="lock"||c.locked)L.locks.push({d,ok:!!(c.locked&&c.locked.value)});
    if(c.alarm_contact&&c.alarm_contact.value)L.open.push(d);
    if((c.alarm_smoke&&c.alarm_smoke.value)||(c.alarm_water&&c.alarm_water.value)||(c.alarm_generic&&c.alarm_generic.value)||(c.alarm_battery&&c.alarm_battery.value))L.alarms.push(d);

  return L;
}

function rnd(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
function demoSeries(minDate){
  const t=todayStr(),R=rnd(7),S={tibber:{kwh:{},kr:{}},hush:{kwh:{},kr:{}},uppv:{kwh:{},kr:{}},vp:{kwh:{},kr:{}},ovr:{kwh:{},kr:{}},d236:{kwh:{},kr:{}},tesla:{kwh:{},kr:{}},traktor:{kwh:{},kr:{}},golv:{kwh:{},kr:{}},entre:{kwh:{},kr:{}}};
  for(let d=addDays(minDate,-2);d<=t;d=addDays(d,1)){
    const doy=(Date.parse(d)-Date.parse(d.slice(0,4)+"-01-01"))/864e5,w=(Math.cos((doy-15)/365*2*Math.PI)+1)/2;
    const heat=8+w*52*(0.8+R()*0.4),house=20+R()*18,other=3+R()*14,tot=heat+house+other,price=0.75+w*0.55+R()*0.35;
    const put=(k,kw)=>{S[k].kwh[d]=kw;S[k].kr[d]=kw*price*(0.95+R()*0.1);};
    put("tibber",tot);put("hush",house);put("uppv",heat);put("vp",heat*0.92);put("ovr",other);put("d236",2+w*9*(0.7+R()*0.6));put("tesla",R()<0.4?0:8+R()*22);S.traktor.kwh[d]=R()<0.3?0:1+R()*4;S.golv.kwh[d]=w*(R()<0.2?0:6+R()*10);S.entre.kwh[d]=w*(R()<0.3?0:2+R()*6);
  }
  return S;
}

function setStatus(t,err){const s=$("#status");s.textContent=t;s.className="status"+(err?" err":"");}
function showErr(msg){const b=$("#errBox");if(msg){b.textContent=msg;b.classList.remove("hide");}else b.classList.add("hide");}
let busy=false;
async function refresh(opts={}){
  if(busy&&!opts.force)return;busy=true;
  $("#demoWarn").classList.toggle("hide",!isDemo());
  try{
    if(!opts.quiet)setStatus("Hämtar…");
    if(isDemo())demoSetup();
    else{const [dv,zn]=await Promise.all([api("/api/manager/devices/device/"),api("/api/manager/zones/zone/")]);state.devices=dv||{};state.zones=zn||{};}
    if(["flows","oversikt","detalj","admin"].includes(state.tab)||opts.flows)await loadFlows(opts.flows);
    drawProp();showErr(null);
    await draw();
    setStatus((isDemo()?"Demo · ":"")+"Uppdaterad "+new Date().toLocaleTimeString("sv-SE",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
  }catch(e){
    showErr("Kunde inte hämta från Homey: "+e.message+". Kontrollera IP, API-nyckel och att sidan öppnas via http på samma nät.");
    setStatus("Fel",true);
  }finally{busy=false;}
}
async function draw(){
  state.keepFocus=document.activeElement&&["q","aq"].includes(document.activeElement.id);
  if(state.tab==="oversikt")await renderOversikt();
  else if(state.tab==="energi")await renderEnergi();
  else if(state.tab==="detalj")await renderDetalj();
  else if(state.tab==="timpris")await renderTimpris();
  else if(state.tab==="klimat")await renderKlimat();
  else if(state.tab==="styr")renderStyr();
  else if(state.tab==="flows")renderFlows();
  else if(state.tab==="status")renderStatus();
  else renderAdmin();
  if(state.modal&&$("#dlg").open)await renderModal();
}
function showTab(t){
  state.tab=t;state.search="";if(t!=="oversikt"&&document.body.classList.contains("panel"))setPanel(false);
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  for(const k of ["oversikt","energi","timpris","detalj","klimat","styr","flows","status","admin"])$("#p-"+k).classList.toggle("hide",k!==t);
  refresh({force:true});
}

/* =====================================================================
   HÄNDELSER
   ===================================================================== */
document.addEventListener("click",e=>{const b=e.target.closest("[data-goto]");if(b)showTab(b.dataset.goto);});
$("#nav").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab);});
$("#segProp").addEventListener("click",e=>{const b=e.target.closest("[data-prop]");if(!b)return;state.prop=b.dataset.prop;drawProp();draw();});
$("#segUnit").addEventListener("click",e=>{const b=e.target.closest("[data-unit]");if(!b)return;state.unit=b.dataset.unit;drawProp();draw();});

document.addEventListener("click",async e=>{
  const th=e.target.closest("#segTheme [data-theme]");if(th){setTheme(th.dataset.theme);return;}
  if(e.target.id==="panelBtn"){showTab("oversikt");setPanel(true);return;}
  if(e.target.id==="panelX"){setPanel(false);return;}
  const sp=e.target.closest("[data-sensper]");if(sp){state.sensPer=sp.dataset.sensper;renderModal();return;}
  const oo=e.target.closest("[data-onoff]"),oa=e.target.closest("[data-act]");if(oo&&!(oa&&oa!==oo&&oo.contains(oa))){openModal("onoff",oo.dataset.onoff);return;}
  const se=e.target.closest("[data-sens]");if(se){openModal("sens",se.dataset.sens);return;}
  const p=e.target.closest("[data-p]");
  if(p){state.preset=p.dataset.p;if(state.preset==="valfri"&&!state.from){state.to=todayStr();state.from=addDays(state.to,-29);}draw();return;}
  if(e.target.closest("[data-close]")){$("#dlg").close();state.modal=null;return;}
  if(e.target.id==="dlg"){$("#dlg").close();state.modal=null;return;}
  const mu=e.target.closest("[data-munit]");if(mu){state.unit=mu.dataset.munit;drawProp();draw();return;}
  const dl=e.target.closest("[data-daily]");if(dl){openModal("daily",dl.dataset.daily);return;}
  const sb=e.target.closest("[data-status]");if(sb){openModal("status",sb.dataset.status);return;}
  const kc=e.target.closest("[data-card]");if(kc){openModal("card",kc.dataset.card);return;}
  const cc=e.target.closest("[data-chart]");if(cc){openModal("chart",cc.dataset.chart);return;}
  const jp=e.target.closest("[data-jump]");if(jp){const el=document.getElementById(jp.dataset.jump);if(el){el.open=true;el.scrollIntoView({behavior:"smooth",block:"start"});}return;}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,card=b.closest("[data-id]"),id=card&&card.dataset.id;
  try{
    if(act==="tgl"){const d=state.devices[b.dataset.dev];await setCap(d.id,"onoff",!d.capabilitiesObj.onoff.value);draw();}
    else if(act==="hide"){(cfg.ui.devices[id]=cfg.ui.devices[id]||{}).show=false;persist();draw();}
    else if(act==="unhide"){(cfg.ui.devices[b.dataset.dev]=cfg.ui.devices[b.dataset.dev]||{}).show=true;persist();draw();}
    else if(act==="toggle"){const d=state.devices[id];await setCap(id,"onoff",!d.capabilitiesObj.onoff.value);draw();}
    else if(act==="flow"){await runFlow(id);state.flash[id]=true;draw();setTimeout(()=>{delete state.flash[id];draw();},1800);}
    else if(act==="zone"){const to=b.dataset.to==="true",z=b.dataset.zone;
      for(const d of propDevices().filter(d=>isLamp(d)&&hasOnoff(d)&&isShown(d)&&zoneName(d)===z))await setCap(d.id,"onoff",to);draw();}
    else if(act==="lock"){const d=state.devices[b.dataset.dev],to=b.dataset.to==="true";if(!to&&!confirm("Låsa upp "+devName(d)+"?"))return;await setCap(d.id,"locked",to);draw();}
    else if(act==="alloff"){
      if(!confirm("Släcka alla tända lampor i "+PROPS.find(p=>p.k===state.prop).name+"?"))return;
      for(const d of propDevices().filter(d=>isLamp(d)&&hasOnoff(d)&&isShown(d)&&d.capabilitiesObj.onoff.value))await setCap(d.id,"onoff",false);draw();}
    else if(act==="test"){await testConn();}
    else if(act==="login"){if(!cfg.workerUrl){showErr("Fyll i serveradressen först.");return;}location.href=cfg.workerUrl.replace(/\/$/,"")+"/login";}
    else if(act==="logout"){try{await fetch(base()+"/logout",{method:"POST",headers:{"Authorization":"Bearer "+cfg.session}});}catch(e){}cfg.session="";persist();state.devices={};draw();refresh({force:true});}
    else if(act==="pin"){if($("#pinIn").value===cfg.pin){state.adminOk=true;draw();}else{$("#pinIn").value="";$("#pinIn").placeholder="Fel PIN";}}
    else if(act==="export"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(cfg,null,2)],{type:"application/json"}));a.download="energicentral-installningar.json";a.click();}
    else if(act==="reset"){if(confirm("Återställa alla inställningar i den här webbläsaren?")){localStorage.removeItem("homeyDash2");cfg=loadCfg();state.cache={};state.devices={};refresh({force:true});}}
  }catch(err){showErr("Åtgärden misslyckades: "+err.message);}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){state.search=t.value;state.keepFocus=true;draw();}
  else if(t.id==="aq"){state.adminSearch=t.value;state.keepFocus=true;renderAdmin();}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  try{
    if(t.dataset.act==="dim"){await setCap(t.closest("[data-id]").dataset.id,"dim",Number(t.value)/100);draw();return;}
    if(t.id==="sensfrom"||t.id==="sensto"){state[t.id==="sensfrom"?"sensFrom":"sensTo"]=t.value;await renderModal();return;}
    if(t.id==="climzone"){state.climZone=t.value;draw();return;}
    if(t.id==="mcmp"){state.cmp=t.value;draw();return;}
    if(t.id==="cmp"){state.cmp=t.value;draw();return;}
    if(t.id==="h236d"){state.h236d=t.value;state.h236m=t.value.slice(0,7);draw();return;}
    if(t.id==="h236m"){state.h236m=t.value;draw();return;}
    if(t.id==="from"){state.from=t.value;draw();return;}
    if(t.id==="to"){state.to=t.value;draw();return;}
    if(t.id==="imp"){const f=t.files[0];if(!f)return;const j=JSON.parse(await f.text());const d=clone(DEFAULTS);
      cfg={...d,...j,ids:{...d.ids,...(j.ids||{})},ui:{devices:{...(j.ui&&j.ui.devices)},flows:{...(j.ui&&j.ui.flows)},status:{...d.ui.status,...(j.ui&&j.ui.status)}}};persist();state.cache={};refresh({force:true});return;}
    if(t.dataset.cfg){
      const path=t.dataset.cfg.split("."),val=t.type==="checkbox"?t.checked:t.value.trim();
      if(path[0]==="ids")cfg.ids[path[1]]=val;else if(path[0]==="markup")cfg.markup=parseFloat(String(val).replace(",","."))||0;else cfg[path[0]]=val;
      if(path[0]==="sheetCsv")state.hourly=null;if(path[0]==="sheetCsv236")state.hourly236=null;
      persist();state.cache={};if(["ip","key","demo","workerUrl","mode"].includes(path[0])){state.devices={};refresh({force:true,flows:true});}else draw();return;}
    if(t.dataset.z236){const s=new Set(cfg.zones236);t.checked?s.add(t.dataset.z236):s.delete(t.dataset.z236);cfg.zones236=[...s];persist();draw();return;}
    if(t.dataset.st){cfg.ui.status[t.dataset.st]=t.checked;persist();return;}
    if(t.dataset.dev||t.dataset.flow){
      const map=t.dataset.dev?cfg.ui.devices:cfg.ui.flows,id=t.dataset.dev||t.dataset.flow,f=t.dataset.f;
      (map[id]=map[id]||{})[f]=f==="alias"?t.value.trim():t.checked;persist();return;}
  }catch(err){showErr(err.message);}
});

(function(){const m=/[#&]session=([a-f0-9]{64})/.exec(location.hash);if(m){cfg.session=m[1];cfg.demo=false;cfg.mode="cloud";persist();history.replaceState(null,"",location.pathname+location.search);}})();
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&(e.target.dataset.card||e.target.dataset.chart||e.target.dataset.daily||e.target.dataset.sens||e.target.dataset.onoff||e.target.dataset.goto||(e.target.dataset.act==="toggle"&&e.target.getAttribute("role")==="switch"))){e.preventDefault();e.target.click();}});
document.addEventListener("mousemove",sensHover);document.addEventListener("touchmove",e=>{if(e.touches[0])sensHover({target:e.target,clientX:e.touches[0].clientX});},{passive:true});
$("#dlg").addEventListener("close",()=>{state.modal=null;});
try{applyTheme(localStorage.getItem("homeyTheme")||"auto");}catch(e){applyTheme("auto");}
drawProp();
refresh({force:true,flows:true});
setInterval(()=>{if(!document.hidden&&state.tab!=="admin")refresh({quiet:true});},REFRESH_MS);
</script>
